<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crosschain Oracle v2 — GenLayer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e0; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #1a1a2e; margin-bottom: 24px; }
.header h1 { font-size: 1.4em; color: #22c55e; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all .2s; }
.btn-primary { background: #22c55e; color: #0a0a0f; }
.btn-primary:hover { background: #16a34a; }
.btn-outline { background: transparent; border: 1px solid #22c55e; color: #4ade80; }
.btn-outline:hover { background: #22c55e20; }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.card { background: #12121a; border: 1px solid #1a1a2e; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.card h2 { font-size: 1.1em; margin-bottom: 12px; color: #4ade80; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
.form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #1a1a2e; background: #0a0a0f; color: #e0e0e0; font-size: 14px; }
.form-group textarea { min-height: 60px; resize: vertical; font-family: monospace; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.stat { background: #12121a; border: 1px solid #1a1a2e; border-radius: 10px; padding: 12px; text-align: center; }
.stat .num { font-size: 1.3em; font-weight: 700; color: #4ade80; }
.stat .label { font-size: 9px; color: #666; margin-top: 4px; }
.status-stale { color: #dc2626; }
.status-fresh { color: #16a34a; }
.explorer-link { color: #22c55e; font-size: 11px; text-decoration: none; }
.toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 24px; border-radius: 8px; font-size: 13px; z-index: 999; }
.toast-success { background: #16a34a; color: white; }
.toast-error { background: #dc2626; color: white; }
.result-box { background: #0a0a0f; padding: 12px; border-radius: 8px; border: 1px solid #1a1a2e; font-size: 12px; white-space: pre-wrap; margin-top: 10px; color: #888; }
.feed-item { padding: 12px; border: 1px solid #1a1a2e; border-radius: 8px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>🔗 Crosschain Oracle</h1>
      <div style="font-size:11px;color:#666;margin-top:4px;">Multi-source AI oracle · Feed history · Staleness detection</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <a class="explorer-link" href="https://explorer-bradbury.genlayer.com/address/0xf2e32c8550C0C48F2C0D5020fcB19F916B9ad3FE" target="_blank">View on Explorer ↗</a>
      <button class="btn btn-outline btn-sm" id="connectBtn">Connect Wallet</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat"><div class="num" id="sTotal">—</div><div class="label">Feeds</div></div>
    <div class="stat"><div class="num" id="sUpdated">—</div><div class="label">Total Updates</div></div>
    <div class="stat"><div class="num" id="sFresh">—</div><div class="label">Fresh</div></div>
    <div class="stat"><div class="num" id="sStale">—</div><div class="label">Stale</div></div>
  </div>

  <div class="card">
    <h2>Create Feed</h2>
    <div class="form-group"><label>Description</label><input id="feedDesc" placeholder="BTC/USD price feed"></div>
    <div class="form-group"><label>Sources (JSON array)</label><textarea id="feedSources" placeholder='[{"name":"binance","url":"https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT"}]'></textarea></div>
    <div class="form-group"><label>Schema (JSON)</label><textarea id="feedSchema" placeholder='{"price":"number"}'></textarea></div>
    <div class="form-group"><label>Max Staleness (seconds)</label><input id="feedMaxStale" placeholder="3600"></div>
    <div class="form-group"><label>Deviation Threshold</label><input id="feedDeviation" placeholder="100"></div>
    <button class="btn btn-primary" id="createBtn">Create Feed</button>
    <div id="createStatus" style="margin-top:10px;font-size:13px;"></div>
  </div>

  <div class="card">
    <h2>Feeds</h2>
    <div id="feedsList" style="color:#666;">Loading from chain...</div>
  </div>

  <div class="card">
    <h2>Feed Actions</h2>
    <div class="form-group"><label>Feed ID (string)</label><input id="feedId" placeholder="1"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-outline" id="updateBtn">Update Feed (AI)</button>
      <button class="btn btn-outline" id="latestBtn">Latest Value</button>
      <button class="btn btn-outline" id="staleBtn">Check Staleness</button>
      <button class="btn btn-outline" id="historyBtn">Feed History</button>
      <button class="btn btn-outline" id="subscribeBtn">Subscribe</button>
    </div>
    <div id="actionStatus" style="margin-top:10px;font-size:13px;"></div>
    <div id="detailBox" class="result-box"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7/dist/ethers.umd.min.js"></script>
<script>
const CONTRACT = '0xf2e32c8550C0C48F2C0D5020fcB19F916B9ad3FE';
const RPC = 'https://rpc-bradbury.genlayer.com';
const ABI = [
  'function create_feed(string description, string sources_json, string schema_json, uint256 max_staleness, uint256 deviation_threshold)',
  'function update_feed(string feed_id)',
  'function subscribe(string feed_id)',
  'function get_latest_value(string feed_id) view returns (string)',
  'function check_staleness(string feed_id) view returns (string)',
  'function get_feed_history(string feed_id, uint256 limit) view returns (string)',
  'function get_feed_count() view returns (uint256)',
  'function list_feeds() view returns (tuple(string,uint256,string,uint256)[])',
];
let contract, account;

async function connectWallet() {
  if (!window.ethereum) return alert('Install MetaMask');
  await window.ethereum.request({ method: 'eth_requestAccounts' });
  const provider = new ethers.providers.Web3Provider(window.ethereum);
  const signer = provider.getSigner();
  account = await signer.getAddress();
  contract = new ethers.Contract(CONTRACT, ABI, signer);
  return account;
}

document.getElementById('connectBtn').onclick = async () => {
  try {
    const addr = await connectWallet();
    document.getElementById('connectBtn').textContent = addr.slice(0,6)+'...'+addr.slice(-4);
    document.getElementById('connectBtn').className = 'btn btn-primary btn-sm';
    toast('Wallet connected!', 'success');
  } catch(e) { toast(e.message, 'error'); }
};

async function genCall(method, args) {
  const res = await fetch(RPC, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'gen_call', params: [{ to: CONTRACT, function: method, args: args }] })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
  return data.result;
}

async function loadFeeds() {
  try {
    const list = await genCall('list_feeds', []);
    const entries = Object.entries(list);
    document.getElementById('sTotal').textContent = entries.length;
    let updates = 0;
    const html = entries.reverse().map(([id, f]) => {
      updates += Number(f.update_count || 0);
      return `<div class="feed-item">
        <div class="q">#${id}: ${f.description}</div>
        <span style="color:#888;font-size:12px;">updates: ${f.update_count} · max_stale: ${f.max_staleness}s · last_updated: ${f.last_updated || 'never'}</span>
      </div>`;
    }).join('') || '<span style="color:#666">No feeds yet</span>';
    document.getElementById('sUpdated').textContent = updates;
    document.getElementById('sFresh').textContent = '—';
    document.getElementById('sStale').textContent = '—';
    document.getElementById('feedsList').innerHTML = html;
  } catch(e) {
    document.getElementById('feedsList').innerHTML = '<span style="color:#666">Could not load feeds</span>';
  }
}

document.getElementById('createBtn').onclick = async () => {
  const desc = document.getElementById('feedDesc').value.trim();
  const sources = document.getElementById('feedSources').value.trim();
  const schema = document.getElementById('feedSchema').value.trim();
  const maxStale = document.getElementById('feedMaxStale').value.trim();
  const dev = document.getElementById('feedDeviation').value.trim();
  if (!desc || !sources || !schema || !maxStale || !dev) return toast('Fill all fields', 'error');
  try { JSON.parse(sources); JSON.parse(schema); } catch(e) { return toast('Sources/Schema must be valid JSON', 'error'); }
  try {
    if (!contract) await connectWallet();
    const tx = await contract.create_feed(desc, sources, schema, maxStale, dev);
    document.getElementById('createStatus').innerHTML = `<span style="color:#16a34a;">Feed created! <a class="explorer-link" href="https://explorer-bradbury.genlayer.com/tx/${tx.hash}" target="_blank">${tx.hash.slice(0,10)}...</a></span>`;
    await tx.wait();
    toast('Feed created!', 'success');
    loadFeeds();
  } catch(e) { toast(e.reason || e.message, 'error'); }
};

document.getElementById('updateBtn').onclick = async () => {
  const id = document.getElementById('feedId').value.trim();
  if (!id) return toast('Enter feed ID', 'error');
  try {
    if (!contract) await connectWallet();
    const tx = await contract.update_feed(id);
    await tx.wait();
    toast('Feed updated via AI consensus!', 'success');
    loadFeeds();
  } catch(e) { toast(e.reason || e.message, 'error'); }
};

document.getElementById('latestBtn').onclick = async () => {
  const id = document.getElementById('feedId').value.trim();
  if (!id) return toast('Enter feed ID', 'error');
  const out = document.getElementById('detailBox');
  out.textContent = 'Loading...';
  try {
    const v = await genCall('get_latest_value', [id]);
    out.textContent = JSON.stringify(JSON.parse(v), null, 2);
  } catch(e) { out.textContent = 'Could not read: ' + e.message; }
};

document.getElementById('staleBtn').onclick = async () => {
  const id = document.getElementById('feedId').value.trim();
  if (!id) return toast('Enter feed ID', 'error');
  const out = document.getElementById('detailBox');
  out.textContent = 'Loading...';
  try {
    const v = await genCall('check_staleness', [id]);
    out.textContent = JSON.stringify(JSON.parse(v), null, 2);
  } catch(e) { out.textContent = 'Could not read: ' + e.message; }
};

document.getElementById('historyBtn').onclick = async () => {
  const id = document.getElementById('feedId').value.trim();
  if (!id) return toast('Enter feed ID', 'error');
  const out = document.getElementById('detailBox');
  out.textContent = 'Loading...';
  try {
    const v = await genCall('get_feed_history', [id, 10]);
    out.textContent = JSON.stringify(JSON.parse(v), null, 2);
  } catch(e) { out.textContent = 'Could not read: ' + e.message; }
};

document.getElementById('subscribeBtn').onclick = async () => {
  const id = document.getElementById('feedId').value.trim();
  if (!id) return toast('Enter feed ID', 'error');
  try {
    if (!contract) await connectWallet();
    const tx = await contract.subscribe(id);
    await tx.wait();
    toast('Subscribed!', 'success');
  } catch(e) { toast(e.reason || e.message, 'error'); }
};

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast toast-'+type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}

loadFeeds();
</script>
</body>
</html>
